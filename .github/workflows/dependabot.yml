name: dependabot

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_meta:
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: checkout
        uses: actions/checkout@v6

      - id: update
        name: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          makefile=mihomo-meta/Makefile
          current_version=$(grep "^PKG_VERSION:=" "$makefile" | cut -d '=' -f 2)
          latest_tag=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          latest_version=${latest_tag#v}
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
          echo "latest_version=$latest_version" >> "$GITHUB_OUTPUT"
          if [ "$current_version" = "$latest_version" ]; then
            echo "mihomo-meta is up to date: $current_version"
            exit 0
          fi
          # take sha256 of every prebuilt binary used by the makefile from the release assets
          assets=$(gh api "repos/MetaCubeX/mihomo/releases/tags/$latest_tag" --jq '.assets[] | "\(.name) \(.digest)"')
          for arch in $(grep -o "^MIHOMO_HASH_[^:]*" "$makefile" | sed "s/^MIHOMO_HASH_//"); do
            digest=$(echo "$assets" | grep "^mihomo-linux-${arch}-${latest_tag}\.gz " | cut -d ' ' -f 2)
            hash=${digest#sha256:}
            if [ -z "$digest" ] || [ "$hash" = "$digest" ]; then
              echo "no sha256 for mihomo-linux-${arch}-${latest_tag}.gz"
              exit 1
            fi
            sed -i "s/^MIHOMO_HASH_${arch}:=.*/MIHOMO_HASH_${arch}:=${hash}/" "$makefile"
          done
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${latest_version}/; s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" "$makefile"

      - id: pr
        name: pr
        if: steps.update.outputs.current_version != steps.update.outputs.latest_version
        uses: peter-evans/create-pull-request@v8
        with:
          branch: dependabot/mihomo-meta
          commit-message: "chore: update mihomo-meta to v${{ steps.update.outputs.latest_version }}"
          title: "chore: update mihomo-meta to v${{ steps.update.outputs.latest_version }}"
          body: |
            [Changelog](https://github.com/MetaCubeX/mihomo/compare/v${{ steps.update.outputs.current_version }}...v${{ steps.update.outputs.latest_version }})
