name: release-packages

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  release:
    name: ${{ matrix.arch }}-${{ matrix.branch }} release
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_generic
          - aarch64_cortex-a72
          - aarch64_cortex-a76
          - mipsel_24kc
          - arm_cortex-a7_neon-vfpv4
        branch:
          - openwrt-24.10
          - openwrt-25.12
          - SNAPSHOT

    steps:
      - name: checkout
        uses: actions/checkout@v6

      # exodus and luci-app-exodus get the version of the release: the tag v1.27.0 builds 1.27.0-r1
      - if: github.ref_type == 'tag'
        name: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -q -E '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::the tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$version/; s/^PKG_RELEASE:=.*/PKG_RELEASE:=1/" exodus/Makefile luci-app-exodus/Makefile
          grep -H '^PKG_VERSION:=' exodus/Makefile luci-app-exodus/Makefile

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: exodus
          PACKAGES: mihomo-meta exodus luci-app-exodus
          INDEX: 1
          KEY_BUILD: ${{ secrets.KEY_BUILD }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          NO_REFRESH_CHECK: true

      - name: compress
        run: |
          tar -c -z -f exodus_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz -C bin/packages/${{ matrix.arch }}/exodus .
          # package versions and the release tag, the update page reads them without downloading the archive
          jq --arg tag "${{ github.ref_name }}" '. + {tag: $tag}' bin/packages/${{ matrix.arch }}/exodus/index.json > exodus_${{ matrix.arch }}-${{ matrix.branch }}.json

      - if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            exodus_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz
            exodus_${{ matrix.arch }}-${{ matrix.branch }}.json

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: exodus_${{ matrix.arch }}-${{ matrix.branch }}
          path: exodus_${{ matrix.arch }}-${{ matrix.branch }}.tar.gz

  # the version of the release as text, once per release: the release channel of the updates pages of keenetic, mikrotik and asus compares it with the installed version
  # after the packages: the release channel offers the release only when the packages of openwrt are in it
  version:
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: version
        run: echo "${GITHUB_REF_NAME#v}" > version.txt

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: version.txt
