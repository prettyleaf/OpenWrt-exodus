name: check

on:
  push:
    branches:
      - mikrotik
  pull_request:
    branches:
      - mikrotik
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          shellcheck -s sh -e SC3043,SC2154,SC1091,SC2016,SC3045,SC2034,SC2119,SC2120,SC2153 \
            install.sh \
            mikrotik/opt/share/exodus/exodus \
            mikrotik/opt/share/exodus/lib/*.sh \
            mikrotik/opt/share/exodus/www/api.cgi

      - name: Web UI syntax
        run: |
          node --check mikrotik/opt/share/exodus/www/app.js
          node --check mikrotik/opt/share/exodus/www/i18n.js

      - name: Config and mixin
        run: |
          jq -e 'type == "object"' mikrotik/opt/share/exodus/defaults/config.json
          jq -e -f mikrotik/opt/share/exodus/lib/mixin.jq mikrotik/opt/share/exodus/defaults/config.json > /dev/null

      - name: Version
        # the version of the releases: MAJOR.MINOR.PATCH
        run: grep -q -E '^[0-9]+\.[0-9]+\.[0-9]+$' mikrotik/opt/share/exodus/VERSION
