<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Exodus</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
<script>try { var t = localStorage.getItem('exodus.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
</head>
<body>
<header class="site-header">
	<div class="container header-inner">
		<a class="brand" href="#/status">
			<span class="logo-tile" data-logo></span>
			<span>Exodus</span>
		</a>
		<span id="indicator" hidden></span>
		<nav id="menu" class="nav" hidden></nav>
		<div class="header-actions">
			<button id="lang" class="btn btn-ghost btn-sm" type="button"></button>
			<button id="theme" class="btn btn-ghost btn-icon btn-sm" type="button"></button>
			<button id="logout" class="btn btn-ghost btn-icon btn-sm" type="button" hidden></button>
		</div>
	</div>
</header>
<main id="content" class="container"></main>
<footer class="container footer">
	<a href="https://github.com/prettyleaf/openwrt-exodus/tree/keenetic" target="_blank" rel="noopener">Exodus</a> · Mihomo · Keenetic
</footer>
<div id="savebar" class="savebar" hidden></div>
<div id="toaster" class="toaster" aria-live="polite"></div>
<div id="dialog" class="dialog-overlay" hidden></div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
