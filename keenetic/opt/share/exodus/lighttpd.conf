# web ui of exodus, its own lighttpd instance, the one of entware (S80lighttpd) is not touched
# @...@ are replaced by the service on start

server.document-root = "@WWW@"
server.port = @PORT@
server.pid-file = "@RUN@/web.pid"
server.errorlog = "@LOG@/web.log"
server.upload-dirs = ( "@RUN@" )
server.tag = "exodus"
server.modules = ( "mod_cgi" )

# profiles are uploaded as json, up to 16 MB
server.max-request-size = 16384

index-file.names = ( "index.html" )
static-file.exclude-extensions = ( ".cgi" )
cgi.assign = ( ".cgi" => "" )

mimetype.assign = (
	".html" => "text/html; charset=utf-8",
	".js" => "text/javascript; charset=utf-8",
	".css" => "text/css; charset=utf-8",
	".svg" => "image/svg+xml",
	".json" => "application/json"
)
